<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151c24">
<meta name="description" content="SXFのSFC図面をスマホで開き、照準で寸法・面積を測り、メモや赤ペン・作図線を書き込める図面ビューア">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="図面スコープ">
<title>図面スコープ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: one-screen survey instrument. Full-bleed drawing canvas; HUD strip on top, tool dock at the bottom, panels slide up over the dock. */
:root{
  --void:#0b0f14;      /* night drawing background */
  --steel:#151c24;     /* HUD panels */
  --steel-2:#1f2a35;   /* raised controls */
  --steel-3:#2a3744;   /* pressed / hover */
  --rule:#30404f;      /* hairlines */
  --text:#e9eef3;
  --dim:#94a3b1;
  --tape:#ffc61a;      /* measuring-tape yellow: active tool, measurements */
  --tape-ink:#1a1300;  /* ink printed on the tape */
  --stake:#ff5b3a;     /* survey-stake red: memos, red pen */
  --ok:#3fd28f;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --f-num:"Chakra Petch","BIZ UDPGothic",ui-monospace,"SF Mono",Menlo,monospace;
  --dock-h:78px;
  --top-h:60px;
  --kb:0px;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---- top HUD ---- */
#top{position:absolute;z-index:5;left:0;right:0;top:0;display:flex;flex-direction:column;gap:9px;padding-block:10px 14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(21,28,36,.97) 0%,rgba(21,28,36,.9) 62%,rgba(21,28,36,0) 100%);pointer-events:none}
.toprow{display:flex;align-items:center;gap:8px;min-width:0}
.toprow>*{pointer-events:auto}
/* open drawings: one tab per file, scrolls sideways */
#tabs{order:1;position:relative;pointer-events:auto;display:flex;align-items:center;gap:6px;overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#tabs::-webkit-scrollbar{display:none}
.ftab{flex:none;display:flex;align-items:stretch;height:36px;max-width:min(64vw,250px);border-radius:11px;border:1px solid var(--rule);background:rgba(31,42,53,.96);transition:background .12s,transform .12s}
.ftab .tsel{min-width:0;flex:1;display:flex;align-items:center;gap:6px;padding:0 12px;border:0;border-radius:11px;background:transparent;color:var(--text);font:700 12.5px/1 var(--f-ui);white-space:nowrap;touch-action:manipulation}
.ftab .tsel:active{transform:scale(.96)}
.ftab .tn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ftab .tn small{font-size:11px;font-weight:700;color:var(--dim);margin-left:5px}
.ftab .tc{flex:none;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--stake);color:#fff;font:700 10.5px/18px var(--f-num);text-align:center}
.ftab.on{background:var(--tape);border-color:transparent;box-shadow:0 6px 16px rgba(255,198,26,.2)}
.ftab.on .tsel{color:var(--tape-ink)}
.ftab.on .tn small{color:rgba(26,19,0,.62)}
.ftab .tx{flex:none;width:34px;border:0;border-left:1px solid rgba(26,19,0,.2);border-radius:0 11px 11px 0;background:transparent;color:var(--tape-ink);display:grid;place-items:center;touch-action:manipulation}
.ftab .tx svg{width:16px;height:16px;stroke-width:2.4}
.ftab.busy .tsel::before{content:"";flex:none;width:9px;height:9px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
.ftab.err .tsel{color:#ff8a70}
.tadd{flex:none;width:42px;height:36px;border-radius:11px;border:1px dashed #4a5d70;background:rgba(31,42,53,.8);color:var(--text);display:grid;place-items:center;touch-action:manipulation}
.tadd:active{transform:scale(.92)}
/* phones held sideways: tabs share the single top row to keep the drawing tall */
@media (max-height:520px) and (min-width:600px){
  #top{flex-direction:row;align-items:center}
  .toprow{display:contents}
  .toprow .file{order:0;flex:0 1 auto;max-width:26%}
  #tabs[hidden]+.toprow .file{flex:1 1 auto;max-width:none}
  #tabs{order:1;flex:1 1 0;min-width:0;margin:0;padding:0 2px}
  #scaleChip{order:2;margin-left:auto}#openBtn{order:3}#menuBtn{order:4}
}
.file{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.fname{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta{font:500 11.5px/1.2 var(--f-num);color:var(--dim);letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fmeta b{color:var(--tape);font-weight:600}
.ibtn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--rule);background:var(--steel-2);display:grid;place-items:center;touch-action:manipulation;transition:transform .12s,background .12s}
.ibtn:active{transform:scale(.92);background:var(--steel-3)}
.chip{height:34px;flex:none;padding:0 11px;border-radius:999px;border:1px solid var(--rule);background:var(--steel-2);font:600 12.5px/1 var(--f-num);color:var(--tape);letter-spacing:.02em;white-space:nowrap;touch-action:manipulation;display:flex;align-items:center;gap:6px}
.chip small{font:700 10px/1 var(--f-ui);color:var(--dim);letter-spacing:.06em}

/* ---- readout: a tape-measure label ---- */
#readout{position:absolute;z-index:4;left:50%;top:calc(var(--top-h) - 4px);transform:translateX(-50%);min-width:196px;max-width:calc(100% - 32px);padding:12px 16px 9px;border-radius:12px;text-align:center;color:var(--tape-ink);background-color:var(--tape);background-image:repeating-linear-gradient(90deg,rgba(26,19,0,.7) 0 1px,transparent 1px 7px),repeating-linear-gradient(90deg,rgba(26,19,0,.7) 0 1px,transparent 1px 35px);background-size:100% 5px,100% 9px;background-repeat:no-repeat;box-shadow:0 8px 24px rgba(0,0,0,.45),inset 0 -2px 0 rgba(0,0,0,.18);pointer-events:none}
#readout .rv{font:700 27px/1.1 var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
#readout .rv.small{font:700 16px/1.35 var(--f-ui);letter-spacing:.02em}
#readout .rs{margin-top:2px;font:700 11.5px/1.35 var(--f-ui);opacity:.82;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout.warn .rs{color:#7a1500;opacity:1}
#hint{position:absolute;z-index:4;left:50%;top:calc(var(--top-h) + 2px);transform:translateX(-50%);max-width:calc(100% - 32px);padding:8px 14px;border-radius:999px;background:rgba(21,28,36,.92);border:1px solid var(--rule);font-size:12.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hint b{color:var(--tape)}

/* ---- selection card ---- */
#selcard{position:absolute;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top-h) - 2px);margin-inline:auto;max-width:440px;background:var(--steel);border:1px solid var(--rule);border-radius:16px;padding:12px 12px 12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 12px 32px rgba(0,0,0,.5);animation:drop .2s ease-out}
#selcard .sbody{min-width:0;flex:1}
#selcard .stitle{font:700 11px/1.2 var(--f-ui);letter-spacing:.08em;color:var(--dim)}
#selcard .sval{margin-top:3px;font:700 18px/1.3 var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
#selcard .sval.memo{font:700 15px/1.45 var(--f-ui);max-height:4.4em;overflow:auto;white-space:pre-wrap}
#selcard .ssub{margin-top:3px;font-size:11.5px;color:var(--dim)}
#selcard .sacts{display:flex;gap:6px;flex:none}
@keyframes drop{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ---- floating controls ---- */
.fl{position:absolute;z-index:4}
#fab{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h) + 16px);width:76px;height:76px;border-radius:50%;border:3px solid rgba(26,19,0,.4);background:var(--tape);color:var(--tape-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:700 12px/1 var(--f-ui);box-shadow:0 8px 22px rgba(0,0,0,.5),0 0 0 7px rgba(255,198,26,.16);touch-action:manipulation;transition:transform .1s}
#fab svg{width:30px;height:30px;stroke-width:2.2}
#fab:active,#fab.hit{transform:scale(.88)}
#leftbtns{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h) + 16px);display:flex;flex-direction:column;gap:10px}
#leftbtns .ibtn{width:46px;height:46px;border-radius:14px;background:rgba(31,42,53,.94)}
#app[data-tool="pen"] #leftbtns{bottom:calc(var(--dock-h) + 70px)}
#app[data-tool="draft"] #leftbtns{bottom:calc(var(--dock-h) + 102px)}
#draftbar{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(var(--dock-h) + 32px);max-width:calc(100% - max(16px,env(safe-area-inset-left,0px)) - max(16px,env(safe-area-inset-right,0px)) - 92px);overflow-x:auto;display:flex;align-items:center;gap:3px;padding:5px;border-radius:999px;background:rgba(21,28,36,.96);border:1px solid var(--rule);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.dm{height:34px;flex:none;padding:0 9px;border:0;border-radius:999px;background:transparent;color:var(--dim);font-weight:700;font-size:12.5px;touch-action:manipulation}
.dm.on{background:var(--text);color:var(--steel)}
#areabar{right:calc(max(16px,env(safe-area-inset-right,0px)) + 88px);bottom:calc(var(--dock-h) + 30px);display:flex;gap:8px}
.pill{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--rule);background:rgba(31,42,53,.96);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:6px;touch-action:manipulation}
.pill.go{background:var(--ok);color:#03200f;border-color:transparent}
.pill:disabled{opacity:.4}
#penbar{left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);overflow-x:auto;bottom:calc(var(--dock-h) + 16px);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;background:rgba(21,28,36,.96);border:1px solid var(--rule);box-shadow:0 8px 22px rgba(0,0,0,.4)}
.sw{width:32px;height:32px;flex:none;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;background:transparent;touch-action:manipulation}
.sw i{display:block;width:20px;height:20px;border-radius:50%;background:var(--c)}
.sw.on{border-color:var(--text)}
.penw{height:32px;flex:none;padding:0 10px;border-radius:999px;border:1px solid var(--rule);background:var(--steel-2);font-size:12px;font-weight:700;touch-action:manipulation}
.penw.on{background:var(--text);color:var(--steel)}
.sep{width:1px;height:22px;background:var(--rule)}

/* ---- dock ---- */
#dock{position:absolute;z-index:5;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(6,minmax(0,100px));justify-content:center;gap:4px;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--steel);border-top:1px solid var(--rule)}
.tool{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:14px;background:transparent;color:var(--dim);font:700 11px/1 var(--f-ui);letter-spacing:.04em;touch-action:manipulation;transition:transform .18s cubic-bezier(.3,1.7,.5,1),background .15s,color .15s,box-shadow .15s}
.tool svg{width:25px;height:25px}
.tool.on{background:var(--tape);color:var(--tape-ink);transform:translateY(-5px);box-shadow:0 8px 18px rgba(255,198,26,.25)}
.tool.on svg{animation:wiggle .35s ease}
@keyframes wiggle{0%{transform:rotate(0)}30%{transform:rotate(-12deg) scale(1.1)}65%{transform:rotate(8deg)}100%{transform:none}}

/* ---- welcome / open card ---- */
#welcome{position:absolute;z-index:7;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--dock-h) + 12px);margin-inline:auto;max-width:460px;max-height:calc(100% - var(--dock-h) - 24px);overflow:auto;background:var(--steel);border:1px solid var(--rule);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:16px;box-shadow:0 22px 60px rgba(0,0,0,.6);animation:rise .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;flex:none}
.brand h1{margin:0;font-size:22px;line-height:1.15;letter-spacing:.04em;text-wrap:balance}
.brand p{margin:3px 0 0;font:600 10.5px/1 var(--f-num);letter-spacing:.24em;color:var(--dim)}
.lead{margin:0;font-size:14px;line-height:1.65;color:#cfd8e0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--rule);background:var(--steel-2);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation;flex:1 1 auto}
.btn.primary{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.btn.danger{color:#ff8a70}
.btn.small{min-height:36px;padding:0 12px;font-size:12.5px;border-radius:11px;flex:0 0 auto}
.btn:active{transform:scale(.97)}
.tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tip{padding:10px 8px;border-radius:12px;background:var(--steel-2);font-size:11.5px;line-height:1.45;color:#cfd8e0;display:flex;flex-direction:column;gap:6px}
.tip svg{color:var(--tape);width:20px;height:20px}
.sect{font:700 11px/1 var(--f-ui);letter-spacing:.12em;color:var(--dim);margin:2px 0 -6px}
.recents{display:flex;flex-direction:column;gap:6px}
#wRecentWrap{display:flex;flex-direction:column;gap:8px}
#wRecentWrap .sect{margin:0}
.rec{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--rule);background:var(--steel-2);touch-action:manipulation}
.rec .rn{min-width:0;flex:1;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .rm{flex:none;font:500 11px/1.3 var(--f-num);color:var(--dim);text-align:right}

/* ---- sheets ---- */
#backdrop{position:absolute;z-index:8;inset:0;background:rgba(5,8,11,.5);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;z-index:9;left:0;right:0;bottom:var(--kb);max-width:600px;margin-inline:auto;max-height:82%;display:flex;flex-direction:column;background:var(--steel);border:1px solid var(--rule);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -14px 44px rgba(0,0,0,.55);padding-block:8px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));animation:sheetIn .26s cubic-bezier(.2,1,.3,1)}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--rule);margin:2px auto 10px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.shead h2{margin:0;flex:1;font-size:17px;letter-spacing:.03em}
.sbody{overflow:auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:13px;background:var(--steel-2);margin-bottom:12px}
.tab{height:36px;border:0;border-radius:10px;background:transparent;color:var(--dim);font-weight:700;font-size:13px;touch-action:manipulation}
.tab.on{background:var(--steel);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.04),0 2px 8px rgba(0,0,0,.3)}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--steel-2);border:1px solid transparent;text-align:left;width:100%;touch-action:manipulation}
.item .ib{flex:none;min-width:44px;height:24px;padding:0 6px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--tape-ink);background:var(--tape)}
.item .ib.memo{background:var(--stake);color:#fff}
.item .ib.ink{background:#3d8bff;color:#fff}
.item .ib.draft{background:#e9eef3;color:#151c24}
.item .it{min-width:0;flex:1;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere}
.item .it .num{font:700 15px/1.3 var(--f-num);font-variant-numeric:tabular-nums}
.item .it small{display:block;color:var(--dim);font-size:11px}
.empty{padding:18px 12px;border-radius:12px;border:1px dashed var(--rule);color:var(--dim);font-size:13px;line-height:1.6;text-align:center}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;font-size:13px;line-height:1.45}
.kv dt{color:var(--dim)}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv dd.n{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px;font-weight:700}
.seg{display:flex;gap:3px;padding:3px;border-radius:11px;background:var(--steel-2);flex:none}
.seg button{height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--dim);font-weight:700;font-size:12.5px;touch-action:manipulation}
.seg button.on{background:var(--tape);color:var(--tape-ink)}
.lay{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;background:var(--steel-2);width:100%;border:0;text-align:left;touch-action:manipulation}
.lay .ln{min-width:0;flex:1;font:600 13px/1.3 var(--f-num);overflow-wrap:anywhere}
.lay .lc{flex:none;font:500 11px/1 var(--f-num);color:var(--dim)}
.tog{flex:none;width:40px;height:24px;border-radius:99px;background:var(--steel-3);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--dim);transition:transform .15s,background .15s}
.on>.tog,.tog.on{background:rgba(255,198,26,.35)}
.on>.tog::after,.tog.on::after{transform:translateX(16px);background:var(--tape)}
.note{font-size:12px;line-height:1.6;color:var(--dim)}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px;border-radius:12px;border:1px solid var(--rule);background:var(--void);color:var(--text);font:400 16px/1.55 var(--f-ui);user-select:text;-webkit-user-select:text}
input[type=number],input[type=text]{height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--rule);background:var(--void);color:var(--text);font:600 16px/1 var(--f-num);width:100%;user-select:text;-webkit-user-select:text}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tagb{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--rule);background:var(--steel-2);font-size:12.5px;font-weight:700;touch-action:manipulation}
.scales{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.scales button{height:42px;border-radius:11px;border:1px solid var(--rule);background:var(--steel-2);font:600 13.5px/1 var(--f-num);touch-action:manipulation}
.scales button.on{background:var(--tape);color:var(--tape-ink);border-color:transparent}
.scales button.auto{grid-column:1/-1;font-family:var(--f-ui);font-weight:700}

/* ---- overlays ---- */
#toast{position:absolute;z-index:20;left:50%;top:calc(var(--top-h) + 8px);transform:translate(-50%,-6px);max-width:calc(100% - 32px);padding:10px 16px;border-radius:999px;background:var(--text);color:var(--steel);font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}
#loading{position:absolute;z-index:15;inset:0;display:grid;place-items:center;background:rgba(11,15,20,.84);animation:fade .15s}
#loading.below{top:var(--top-h);z-index:4;background:rgba(11,15,20,.6)}
.load{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:700;font-size:14px;text-align:center;padding:0 24px}
.load svg{width:64px;height:64px;color:var(--tape);animation:spin 1.4s linear infinite}
.load small{font-size:12px;color:var(--dim);font-weight:400;max-width:280px;overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
#dialog{position:absolute;z-index:16;inset:0;display:grid;place-items:center;background:rgba(5,8,11,.6);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.dcard{max-width:380px;width:100%;background:var(--steel);border:1px solid var(--rule);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.dcard h3{margin:0;font-size:17px}
.dcard p{margin:0;font-size:14px;line-height:1.65;color:#cfd8e0;white-space:pre-wrap}
#imgview{position:absolute;z-index:16;inset:0;background:rgba(5,8,11,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#imgview img{max-width:100%;max-height:70%;border-radius:10px;border:1px solid var(--rule);-webkit-touch-callout:default;user-select:auto}
#imgview p{margin:0;font-size:13px;color:var(--dim);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(()=>{
'use strict';
/* =========================================================
   helpers
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const D2R=Math.PI/180;
const now=()=>performance.now();
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>r()));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uidSeq=0;const uid=()=>Date.now().toString(36)+(uidSeq++).toString(36)+Math.random().toString(36).slice(2,6);

const LS={
  get(k,d){try{const v=localStorage.getItem('zs:'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('zs:'+k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{localStorage.removeItem('zs:'+k)}catch(e){}},
  ok(){try{localStorage.setItem('zs:t','1');localStorage.removeItem('zs:t');return true}catch(e){return false}}
};
const settings=Object.assign({theme:'dark',sound:true,haptic:true,text:true,weight:true},LS.get('settings',{}));
const saveSettings=()=>LS.set('settings',settings);

/* =========================================================
   SFC parsing. PARSER() is self-contained: it runs on this page and,
   via its own source text, inside a Web Worker so big files never freeze the UI.
   ========================================================= */
function PARSER(){
'use strict';
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const D2R=Math.PI/180;
class F64{constructor(n=4096){this.a=new Float64Array(n);this.n=0}push(v){if(this.n===this.a.length){const b=new Float64Array(this.a.length*2);b.set(this.a);this.a=b}this.a[this.n++]=v}done(){return this.a.slice(0,this.n)}}
class I32{constructor(n=4096){this.a=new Int32Array(n);this.n=0}push(v){if(this.n===this.a.length){const b=new Int32Array(this.a.length*2);b.set(this.a);this.a=b}this.a[this.n++]=v}done(){return this.a.slice(0,this.n)}}
// cheap check on raw bytes before a file is accepted as a tab
function sniff(buf){
  const u=new Uint8Array(buf),n=u.length;let i=0;
  while(i<n){i=u.indexOf(0x2F,i);if(i<0||i+4>=n)break;if(u[i+1]===0x2A&&u[i+2]===0x53&&u[i+3]===0x58&&u[i+4]===0x46)return'ok';i++}
  let head='';const m=Math.min(n,4000);for(let k=0;k<m;k++)head+=String.fromCharCode(u[k]);
  return/ISO-10303-21/.test(head)?'P21':'NOTSFC';
}
function decodeBytes(buf){
  const u8=new Uint8Array(buf);
  if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)return new TextDecoder('utf-8').decode(u8.subarray(3));
  try{return new TextDecoder('utf-8',{fatal:true}).decode(u8)}catch(e){}
  try{return new TextDecoder('shift_jis').decode(u8)}catch(e){}
  return new TextDecoder('utf-8').decode(u8);
}
// parse "( ... )" starting at s[i]==='(' ; returns [values,endIndex]
function parseParams(s,i){
  const out=[];const n=s.length;i++;
  while(i<n){
    let c=s.charCodeAt(i);
    while(c===32||c===9||c===10||c===13){i++;c=s.charCodeAt(i)}
    if(c===41)return[out,i+1];
    if(c===44){i++;continue}
    if(c===92&&s.charCodeAt(i+1)===39){ // \' ... \'
      i+=2;let buf='',st=i;
      while(i<n){const ch=s.charCodeAt(i);if(ch===92){const nx=s.charCodeAt(i+1);if(nx===39){buf+=s.slice(st,i);i+=2;st=-1;break}if(nx===92){buf+=s.slice(st,i)+'\\';i+=2;st=i;continue}}i++}
      if(st>=0)buf+=s.slice(st,i);
      out.push(buf);continue;
    }
    if(c===39){ // ' ... '
      i++;let buf='',st=i;
      while(i<n){const ch=s.charCodeAt(i);if(ch===39){if(s.charCodeAt(i+1)===39){buf+=s.slice(st,i)+"'";i+=2;st=i;continue}buf+=s.slice(st,i);i++;st=-1;break}i++}
      if(st>=0)buf+=s.slice(st,i);
      out.push(buf);continue;
    }
    if(c===40){const r=parseParams(s,i);out.push(r[0]);i=r[1];continue}
    const st=i;while(i<n){const ch=s.charCodeAt(i);if(ch===44||ch===41)break;i++}
    out.push(s.slice(st,i).trim());
  }
  return[out,i];
}
function parseSFC(text){
  if(text.indexOf('/*SXF')<0){
    if(/ISO-10303-21/.test(text.slice(0,4000)))throw new Error('P21');
    throw new Error('NOTSFC');
  }
  const feats=[];const re=/#(\d+)\s*=\s*([A-Za-z_]\w*)\s*\(/g;let m;
  while((m=re.exec(text))){
    const r=parseParams(text,re.lastIndex-1);
    feats.push({id:+m[1],name:m[2].toLowerCase(),p:r[0]});
    re.lastIndex=r[1];
  }
  return feats;
}
const num=v=>{if(typeof v==='number')return v;if(typeof v==='string'){const x=parseFloat(v);return isFinite(x)?x:0}return 0};
const int=v=>Math.round(num(v));
const str=v=>typeof v==='string'?v:(v==null?'':String(v));
function list(v){
  if(Array.isArray(v))return v.map(num);
  if(typeof v!=='string')return[];
  const s=v.trim().replace(/^\(/,'').replace(/\)$/,'');
  if(!s.trim())return[];
  return s.split(',').map(t=>{const x=parseFloat(t);return isFinite(x)?x:0});
}

const PRE_COLORS=[null,[0,0,0],[255,0,0],[0,255,0],[0,0,255],[255,255,0],[255,0,255],[0,255,255],[255,255,255],[192,0,128],[192,128,64],[255,128,0],[128,192,128],[0,128,255],[128,64,255],[192,192,192],[128,128,128]];
const LT_NAMES={'continuous':1,'dashed':2,'dashed spaced':3,'long dashed dotted':4,'long dashed double-dotted':5,'long dashed triplicate-dotted':6,'dotted':7,'chain':8,'chain double dash':9,'dashed dotted':10,'double-dashed dotted':11,'dashed double-dotted':12,'double-dashed double-dotted':13,'dashed triplicate-dotted':14,'double-dashed triplicate-dotted':15};

function buildModel(feats){

      case 'drawing_sheet_feature':if(!M.sheet){M.sheet={name:str(p[0]),type:int(p[1]),orient:int(p[2]),x:num(p[3]),y:num(p[4]),comps:buf};buf=[]}break;
      case 'sfig_org_feature':{const name=str(p[0]);if(!M.defs.has(name))M.defs.set(name,{name,kind:int(p[1]),comps:buf});buf=[];const bg=/背景色\$\$[^$]*\$\$(\d+)[_,](\d+)[_,](\d+)/.exec(name);if(bg)M.bg=[+bg[1],+bg[2],+bg[3]];break}

}

    else{
      if(!job||job.v.cx!==V.cx||job.v.cy!==V.cy||job.v.z!==V.z||job.th!==settings.theme){job={v:{cx:V.cx,cy:V.cy,z:V.z},th:settings.theme,ms:0,gen:renderGen(nctx,W,H,dpr,{cx:V.cx,cy:V.cy,z:V.z})}}

    }

  if(!D){setHint('');return}
  if(S.tool==='memo')setHint('メモを置きたい場所を<b>タップ</b>');
  else if(S.tool==='pen')setHint(S.eraser?'なぞった書き込みを<b>消します</b>':'<b>1本指</b>で書く · 2本指で移動');
  else setHint('');

/* =========================================================
   notes model: add / delete / undo / save
   ========================================================= */
function pushUndo(u){S.undo.push(u);if(S.undo.length>60)S.undo.shift();updateUndo()}
function updateUndo(){$('#undoBtn').hidden=!S.undo.length}
function notesChanged(){requestFrame();scheduleSave();renderTabs();if(!$('#menuSheet').hidden&&menuTab==='notes')renderMenu()}
function addNote(n){n._pop=now();S.notes.push(n);pushUndo({op:'add',id:n.id});notesChanged()}
function deleteNote(id){const i=S.notes.findIndex(n=>n.id===id);if(i<0)return;const[n]=S.notes.splice(i,1);pushUndo({op:'del',note:n,index:i});if(S.sel===id)select(null);notesChanged()}
function editNote(id,patch){const n=S.notes.find(x=>x.id===id);if(!n)return;pushUndo({op:'edit',id,before:JSON.parse(JSON.stringify(n))});Object.assign(n,patch);notesChanged()}
function undo(){
  const u=S.undo.pop();updateUndo();if(!u)return;
  if(u.op==='add'){const i=S.notes.findIndex(n=>n.id===u.id);if(i>=0)S.notes.splice(i,1);if(S.sel===u.id)select(null)}
  else if(u.op==='del'){S.notes.splice(Math.min(u.index,S.notes.length),0,u.note)}
  else if(u.op==='edit'){const i=S.notes.findIndex(n=>n.id===u.id);if(i>=0)S.notes[i]=u.before}
  else if(u.op==='clear'){S.notes=u.notes}
  else if(u.op==='hide'){setHidden(u.i,false)}
  else if(u.op==='unhideAll'){u.list.forEach(i=>{D.hid[i]=1;dirtyPrim(D,i)});invalidateAll()}
  if(S.sel)select(S.notes.find(n=>n.id===S.sel)||null);
  sfx('undo');toast('元に戻しました');notesChanged();
}
function cleanNotes(arr){return(arr||S.notes).map(n=>{const o={};for(const k in n)if(k[0]!=='_')o[k]=n[k];return o})}

/* ---------- storage: account (db) → this browser (localStorage) ---------- */
const capCache={};
function useCap(name){const C=window.claude;if(!C||typeof C.use!=='function')return Promise.resolve(null);if(!capCache[name])capCache[name]=C.use(name).catch(()=>null);return capCache[name]}
const Store={
  mode:'pending',db:null,uid:null,ready:null,
  init(){this.ready=(async()=>{try{const[db,user]=await Promise.all([useCap('db'),useCap('user')]);if(db&&user){const id=await user.id();let canWrite=null;try{canWrite=await user.can('data.write')}catch(e){}if(id&&canWrite!==false){this.db=db;this.uid=id;this.mode='cloud'}}}catch(e){}if(this.mode!=='cloud')this.mode=LS.ok()?'local':'none'})();return this.ready},
  ref(hash){return this.db.collection('data/users/'+this.uid).doc('d-'+hash)},
  async load(hash){
    await this.ready;let cloud=null;const local=LS.get('n:'+hash,null);
    if(this.mode==='cloud'){try{const s=await this.ref(hash).get();if(s.exists)cloud=s.data()}catch(e){}}
    if(cloud&&local)return(local.updatedAt||0)>(cloud.updatedAt||0)?local:cloud;
    return cloud||local;
  },
  async save(hash,body){
    await this.ready;LS.set('n:'+hash,body);
    const idx=LS.get('recent',[]).filter(r=>r.hash!==hash);idx.unshift({hash,name:body.name,updatedAt:body.updatedAt,count:body.notes.length});LS.set('recent',idx.slice(0,20));
    if(this.mode==='cloud'){
      try{await this.ref(hash).set(body)}catch(e){
        if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));await this.ref(hash).set(body);return}
        if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){this.mode=LS.ok()?'local':'none';toast('アカウントに保存できないため、この端末に保存します');return}
        throw e;
      }
    }else if(this.mode==='none')throw new Error('nostore');
  },
  async recent(){
    await this.ready;let list=LS.get('recent',[]);
    if(this.mode==='cloud'){try{const q=await this.db.collection('data/users/'+this.uid).orderBy('updatedAt','desc').limit(15).get();const cl=q.docs.map(d=>{const b=d.data()||{};return{hash:b.hash,name:b.name,updatedAt:b.updatedAt,count:(b.notes||[]).length}}).filter(r=>r.hash);const seen=new Set(cl.map(r=>r.hash));list=cl.concat(list.filter(r=>!seen.has(r.hash))).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}catch(e){}}
    return list.slice(0,10);
  }
};
/* ---------- saving: one queued write per drawing, so switching tabs never drops an edit ---------- */
let saveTimer=0,saveBusy=false;const saveQ=new Map();
function scheduleSave(){if(!D||D.noSave)return;clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,650)}
function flushSave(){
  clearTimeout(saveTimer);saveTimer=0;if(!D||D.noSave)return;
  const hidden=[];for(let i=0;i<D.hid.length;i++)if(D.hid[i])hidden.push(i);
  saveQ.set(D.hash,{kind:'drawing',name:D.name,hash:D.hash,size:D.size,updatedAt:Date.now(),manual:S.manual||0,notes:cleanNotes(S.notes),hidden});
  pumpSave();
}
async function pumpSave(){
  if(saveBusy)return;saveBusy=true;
  while(saveQ.size){
    const[hash,body]=saveQ.entries().next().value;saveQ.delete(hash);
    try{
      const bytes=new TextEncoder().encode(JSON.stringify(body)).length;
      if(bytes>250000)toast('書き込みが多すぎて保存できません。古い手書きを消してください',3500);
      else await Store.save(hash,body);
    }catch(e){if(Store.mode==='none')toast('この画面ではメモを保存できません。画像やテキストで書き出してください',3500)}
  }
  saveBusy=false;
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveTimer)flushSave()});
window.addEventListener('pagehide',()=>{if(saveTimer)flushSave()});

/* ---------- local file cache (per-device convenience): files + a small index ---------- */
const Cache={
  db:null,MAXN:30,MAXB:300e6,
  open(){
    if(this.db)return this.db;
    this.db=new Promise(res=>{
      let done=false;const fin=v=>{if(!done){done=true;res(v)}else if(v){try{v.close()}catch(e){}}};setTimeout(()=>fin(null),2500);
      try{
        const r=indexedDB.open('zumen-scope',2);
        r.onupgradeneeded=e=>{try{
          const db=r.result,tx=r.transaction;const files=db.objectStoreNames.contains('files')?tx.objectStore('files'):db.createObjectStore('files',{keyPath:'hash'});
          if(!db.objectStoreNames.contains('meta')){const meta=db.createObjectStore('meta',{keyPath:'hash'});
            if(e.oldVersion>=1){const c=files.openCursor();c.onsuccess=()=>{const k=c.result;if(!k)return;const v=k.value||{};if(v.hash)meta.put({hash:v.hash,name:v.name||'',size:v.buf?v.buf.byteLength:0,at:v.at||0});k.continue()}}}
        }catch(err){}};
        r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{try{db.close()}catch(e){}};fin(db)};r.onerror=()=>fin(null);r.onblocked=()=>fin(null);
      }catch(e){fin(null)}
    });
    return this.db;
  },
  async req(stores,mode,fn){const db=await this.open();if(!db)return null;return new Promise(res=>{try{const t=db.transaction(stores,mode);const out=fn(t);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:true);t.onerror=()=>res(null);t.onabort=()=>res(null)}catch(e){res(null)}})},
  async put(hash,name,buf){
    const at=Date.now();
    const ok=await this.req(['files','meta'],'readwrite',t=>{t.objectStore('files').put({hash,name,buf,at});t.objectStore('meta').put({hash,name,size:buf.byteLength,at})});
    if(!ok)return false;
    const all=await this.req(['meta'],'readonly',t=>t.objectStore('meta').getAll());
    if(Array.isArray(all)){
      all.sort((a,b)=>(b.at||0)-(a.at||0));const keep=new Set(DOCS.map(x=>x.hash));let n=0,bytes=0;const drop=[];
      for(const r of all){n++;bytes+=r.size||0;if(keep.has(r.hash)||r.hash===hash)continue;if(n>this.MAXN||bytes>this.MAXB)drop.push(r.hash)}
      if(drop.length)await this.req(['files','meta'],'readwrite',t=>{const f=t.objectStore('files'),m=t.objectStore('meta');drop.forEach(h=>{f.delete(h);m.delete(h)})});
    }
    return true;
  },
  async get(hash){const r=await this.req(['files'],'readonly',t=>t.objectStore('files').get(hash));return r&&r.buf?r:null},
  async touch(hash){const r=await this.req(['meta'],'readonly',t=>t.objectStore('meta').get(hash));if(r&&r.hash){r.at=Date.now();await this.req(['meta'],'readwrite',t=>t.objectStore('meta').put(r))}},
  async last(){const all=await this.req(['meta'],'readonly',t=>t.objectStore('meta').getAll());if(!Array.isArray(all)||!all.length)return null;all.sort((a,b)=>(b.at||0)-(a.at||0));return this.get(all[0].hash)},
  async has(){const k=await this.req(['meta'],'readonly',t=>t.objectStore('meta').getAllKeys());return Array.isArray(k)?new Set(k):null},
  async list(){const all=await this.req(['meta'],'readonly',t=>t.objectStore('meta').getAll());return Array.isArray(all)?all:[]}
};
async function hashBytes(buf){
  if(buf.byteLength>=4e6&&PW.ok!==false){const m=await PW.hash(buf);if(m&&m.ok&&m.hash)return m.hash}   // big files: hash off the main thread
  try{if(crypto&&crypto.subtle){const h=await crypto.subtle.digest('SHA-256',buf);return Array.from(new Uint8Array(h)).slice(0,12).map(b=>b.toString(16).padStart(2,'0')).join('')}}catch(e){}
  let h1=0x811c9dc5,h2=0x9747b28c;const u=new Uint8Array(buf);for(let i=0;i<u.length;i++){h1^=u[i];h1=Math.imul(h1,16777619);h2^=u[i];h2=Math.imul(h2,2246822519)}
  return(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')+u.length.toString(16);
}

/* =========================================================
   open drawings: one tab per file. Parsed drawings stay in memory
   (within a budget) so switching tabs is instant.
   ========================================================= */
const DOCS=[];let CUR=null;
const PARSE_BUDGET=650000,MAX_PARSED=10,SNAP_KEEP=3;
function newDoc(o){return{id:uid(),name:o.name||'図面',hash:o.hash,size:o.size||0,sample:!!o.sample,buf:o.buf||null,cached:o.cached,D:null,job:null,err:null,notes:[],undo:[],manual:0,view:null,hidden:null,vis:null,loaded:false,loadP:null,used:0,snap:null,shown:false,title:''}}
function estCost(x){const d=x.D;return d?d.np+d.texts.length*2+(d.pts.length>>3):Math.max(500,(x.size||0)/80)}
function ensureParsed(doc){
  if(doc.D)return Promise.resolve(true);
  if(doc.err)return Promise.resolve(false);
  if(!doc.job){
    doc.job=(async()=>{
      await null;
      try{
        let buf=doc.buf;
        if(!buf){const f=await Cache.get(doc.hash);if(f&&f.buf){buf=f.buf;if(!doc.size)doc.size=buf.byteLength}}
        if(!buf){doc.err='NOFILE';return false}
        doc.buf=buf;
        let m=buf.byteLength<65536?{fallback:true}:await PW.parse(buf);
        if(m.fallback){if(buf.byteLength>=65536){if(CUR===doc)showLoading(doc.name);await nextFrame();await nextFrame()}try{m={ok:true,R:Parser.run(buf)}}catch(e){m={ok:false,err:String(e&&e.message||e)}}}
        if(!m.ok){doc.err=m.err||'ERR';return false}
        if(DOCS.indexOf(doc)<0)return false;
        attach(doc,m.R);return true;
      }finally{doc.job=null;renderTabs()}
    })();
    renderTabs();
  }
  return doc.job;
}
function attach(doc,R){
  const d=makeD(R,{name:doc.name,size:doc.size,hash:doc.hash,sample:doc.sample});
  if(doc.vis&&doc.vis.length===d.vis.length)d.vis.set(doc.vis);
  if(doc.hidden){for(const i of doc.hidden)if(i>=0&&i<d.np)d.hid[i]=1;doc.hidden=null}
  doc.D=d;doc.title=((d.info&&d.info.drawing)||d.sheet.name||'').trim();
  if(doc.cached===true&&doc.buf&&doc.buf.byteLength>2e6)doc.buf=null;   // big files are re-read from this device's copy if ever needed again
  if(!doc.used)doc.used=1;
  trimParsed();
}
// keep the most recently viewed drawings parsed; the rest keep only their notes and re-parse on demand
function trimParsed(){
  const list=DOCS.filter(x=>x.D&&x!==CUR).sort((a,b)=>b.used-a.used);
  let tot=CUR&&CUR.D?estCost(CUR):0,n=CUR&&CUR.D?1:0;
  for(const x of list){const c=estCost(x);if(n<MAX_PARSED&&tot+c<=PARSE_BUDGET){tot+=c;n++}else unparse(x)}
}
function unparse(x){
  const d=x.D;if(!d)return;x.vis=d.vis.slice();const h=[];for(let i=0;i<d.hid.length;i++)if(d.hid[i])h.push(i);x.hidden=h;x.D=null;x.snap=null;
  if(x.cached&&x.buf&&x.buf.byteLength>2e6)x.buf=null;
}
// parse the other tabs in the background, one at a time
let preT=0,preRun=0;
function schedulePreload(ms){clearTimeout(preT);preT=setTimeout(preload,ms==null?450:ms)}
let lastInput=0;['pointerdown','pointermove','wheel','keydown'].forEach(t=>window.addEventListener(t,()=>{lastInput=now()},{capture:true,passive:true}));
async function preload(){
  const token=++preRun;
  while(token===preRun){
    if(!CUR||!CUR.D){schedulePreload(800);return}
    const noWorker=PW.ok===false;   // without a worker only small files are read ahead, and only while the screen is idle
    const i0=Math.max(0,DOCS.indexOf(CUR));const order=DOCS.slice(i0+1).concat(DOCS.slice(0,i0));
    let tot=0,n=0;for(const x of DOCS)if(x.D){tot+=estCost(x);n++}
    const next=order.find(x=>!x.D&&!x.err&&!x.job&&(!noWorker||(x.size||0)<1.5e6));
    if(!next||n>=MAX_PARSED||tot+estCost(next)>PARSE_BUDGET*.85)return;
    if(noWorker&&(interacting()||needBase||now()-lastInput<1200)){schedulePreload(700);return}
    await ensureParsed(next);
    if(next.D&&!next.loaded)loadNotes(next);
    await new Promise(r=>setTimeout(r,150));
  }
}
let spare=null;
function freshBase(){const c=spare&&spare.width===cv.width&&spare.height===cv.height?spare:document.createElement('canvas');spare=null;c.width=cv.width;c.height=cv.height;return c}
function trimSnaps(){DOCS.filter(x=>x.snap).sort((a,b)=>b.used-a.used).slice(SNAP_KEEP).forEach(x=>x.snap=null)}
function clearSnaps(){DOCS.forEach(x=>x.snap=null)}
// park the current drawing's state (notes, undo, view, last rendered image) on its tab
function stash(){
  const c=CUR;if(!c)return;
  if(saveTimer)flushSave();
  c.notes=S.notes;c.undo=S.undo;c.manual=S.manual;
  if(D&&c.D===D){
    c.view={cx:V.cx,cy:V.cy,z:V.z,fitZ};
    if(snapView&&lastBaseMs>=26){const fresh=!needBase&&!job&&snapView.cx===V.cx&&snapView.cy===V.cy&&snapView.z===V.z;c.snap={canvas:base,view:snapView,fresh,theme:settings.theme,w:base.width,h:base.height,ms:lastBaseMs};base=freshBase();bctx=base.getContext('2d');trimSnaps()}
    else c.snap=null;
  }
}
function resetTransient(){S.mA=null;S.areaPts=[];S.snap=null;S.dA=null;S.dBase=null;lastSnapKey='';effects.length=0;fly.on=false;inertia.on=false;updateAreaBar();select(null)}
let actSeq=0;
async function activate(doc,opt={}){
  if(!doc||DOCS.indexOf(doc)<0)return false;
  if(CUR===doc&&doc.D&&D===doc.D){hideLoading();return true}
  const seq=++actSeq;
  stash();
  CUR=doc;doc.used=now();saveTabs();renderTabs();
  if(!doc.D){
    D=null;S.notes=doc.notes;S.undo=doc.undo;S.manual=doc.manual;resetTransient();updateUndo();renderTitle();invalidateAll();
    const lt=setTimeout(()=>{if(CUR===doc&&!doc.D)showLoading(doc.name)},140);
    const ok=await ensureParsed(doc);clearTimeout(lt);
    if(seq!==actSeq)return ok;
    hideLoading();
    if(!ok){
      const[t,b]=errText(doc.err);if(!opt.quiet)dialog(t,(DOCS.length>1?doc.name+'\n':'')+b);
      closeDoc(doc,{auto:!opt.noFallback,quiet:opt.quiet});return false;
    }

  show(doc);return true;
}
function show(doc){
  D=doc.D;S.notes=doc.notes;S.undo=doc.undo;S.manual=doc.manual;resetTransient();updateUndo();hideLoading();
  if(!doc.shown){doc.shown=true;if(D.bg&&!LS.get('themeChosen',false)){const th=(.2126*D.bg[0]+.7152*D.bg[1]+.0722*D.bg[2])>128?'light':'dark';if(th!==settings.theme){settings.theme=th;colCache.clear();clearSnaps()}}}
  renderTitle();
  if(doc.view){V.cx=doc.view.cx;V.cy=doc.view.cy;V.z=doc.view.z;fitZ=doc.view.fitZ}else fitView();
  // a heavy drawing comes back from its last rendered image; it is redrawn only if that image is out of date
  const sn=doc.snap;doc.snap=null;
  if(sn&&sn.w===cv.width&&sn.h===cv.height&&sn.theme===settings.theme){spare=base;base=sn.canvas;bctx=base.getContext('2d');job=null;snapView=sn.view;lastBaseMs=sn.ms;needBase=!sn.fresh}
  else{lastBaseMs=0;invalidateAll()}
  if(aiming())updateSnap();requestFrame();toolHint();readoutSoon();renderChip();renderTabs();
  if(!$('#menuSheet').hidden)renderMenu();
  if(!doc.loaded)loadNotes(doc);
  trimParsed();schedulePreload();
}
function loadNotes(doc){
  if(doc.loadP)return doc.loadP;
  doc.loadP=(async()=>{
    let saved=null;try{saved=await Store.load(doc.hash)}catch(e){}
    if(DOCS.indexOf(doc)<0)return;
    const cur=CUR===doc;const have=cur?S.notes:doc.notes;let notes=have;
    if(saved&&Array.isArray(saved.notes)){
      const ids=new Set(have.map(n=>n.id));notes=saved.notes.filter(n=>n&&!ids.has(n.id)).concat(have);
      if(!(cur?S.manual:doc.manual)&&saved.manual>0){doc.manual=saved.manual;if(cur)S.manual=saved.manual}
      if(Array.isArray(saved.hidden)&&saved.hidden.length){
        if(doc.D){const d=doc.D;saved.hidden.forEach(i=>{if(i>=0&&i<d.np&&!d.hid[i]){d.hid[i]=1;dirtyPrim(d,i)}});if(cur)invalidateAll()}
        else doc.hidden=(doc.hidden||[]).concat(saved.hidden);
      }
      if(have.length&&cur)scheduleSave();
    }else if(doc.sample&&!have.length)notes=exampleNotes();
    doc.notes=notes;doc.loaded=true;
    if(cur){S.notes=notes;renderChip();requestFrame();if(!$('#menuSheet').hidden&&menuTab==='notes')renderMenu()}
    renderTabs();
  })();
  return doc.loadP;
}
function errText(c){
  if(c==='P21')return['P21形式のファイルです','このアプリはSXFのSFC形式（.sfc）に対応しています。\nCADでSFC形式に書き出してから開いてください。'];
  if(c==='NOTSFC')return['SFCファイルではないようです','拡張子が .sfc のSXF図面ファイルを選んでください。'];
  if(c==='EMPTY')return['表示できる要素がありません','ファイルは読み込めましたが、図形や文字が見つかりませんでした。'];
  if(c==='NOFILE')return['ファイルが見つかりません','この端末に図面ファイルが残っていません。もう一度ファイルを選んでください。'];
  return['読み込めませんでした','ファイルが壊れているか、未対応の書き方が含まれています。\n（'+c+'）'];
}
function closeDoc(doc,o={}){
  const i=DOCS.indexOf(doc);if(i<0)return;
  const wasCur=doc===CUR;
  if(wasCur){if(saveTimer)flushSave();CUR=null;D=null;S.notes=[];S.undo=[];resetTransient();updateUndo()}
  DOCS.splice(i,1);doc.D=null;doc.snap=null;doc.buf=null;
  saveTabs();renderTabs();
  if(wasCur){
    const next=DOCS[Math.min(i,DOCS.length-1)];
    if(next&&o.auto!==false)activate(next,{quiet:o.quiet});
    else{renderTitle();invalidateAll();if(!next)showWelcome()}
  }
}
function closeAll(){
  if(saveTimer)flushSave();DOCS.splice(0).forEach(x=>{x.D=null;x.snap=null;x.buf=null});preRun++;
  CUR=null;D=null;S.notes=[];S.undo=[];resetTransient();updateUndo();saveTabs();renderTabs();renderTitle();invalidateAll();showWelcome();
}
function saveTabs(){LS.set('tabs',DOCS.filter(x=>!x.sample&&x.cached!==false).map(x=>({hash:x.hash,name:x.name,size:x.size})));LS.set('activeTab',CUR&&!CUR.sample?CUR.hash:'')}
function addDoc(o){
  const doc=newDoc(o);DOCS.push(doc);
  if(!o.sample&&o.buf&&!o.cached){
    // keep a copy on this device so the tab can come back next time; big files wait until the first drawing is up
    const go=()=>{if(!doc.buf||DOCS.indexOf(doc)<0)return;Cache.put(doc.hash,doc.name,doc.buf).then(ok=>{doc.cached=!!ok;saveTabs();if(ok&&doc.D&&doc.buf&&doc.buf.byteLength>2e6)doc.buf=null})};
    const later=()=>{if(DOCS.indexOf(doc)<0)return;if(doc.job||(CUR===doc&&!doc.D)||needBase||job){setTimeout(later,600);return}go()};
    if(o.buf.byteLength>4e6)setTimeout(later,1200);else go();
  }
  return doc;
}
function dropSample(keep){const s=DOCS.find(x=>x.sample);if(s&&s!==keep)closeDoc(s,{auto:false})}
// open one or many files picked by the viewer; the first becomes the active tab right away
const shortErr=c=>c==='P21'?'P21形式':c==='NOTSFC'?'SFCではありません':c==='EMPTY'?'図形がありません':'読み込めません';
async function openFiles(list){
  list=Array.from(list||[]);if(!list.length)return false;$('#welcome').hidden=true;
  const bad=[],added=[];let first=null,firstP=null,code='';
  for(const f of list){
    let buf=null;try{buf=await f.arrayBuffer()}catch(e){}
    if(!buf){bad.push(f.name+'（読み込めません）');code='READ';continue}
    const sn=Parser.sniff(buf);if(sn!=='ok'){bad.push(f.name+'（'+shortErr(sn)+'）');code=sn;continue}
    const hash=await hashBytes(buf);
    let doc=DOCS.find(x=>x.hash===hash);
    if(!doc){doc=addDoc({name:f.name,hash,size:buf.byteLength,buf});added.push(doc)}
    if(!first){first=doc;firstP=activate(doc,{quiet:true});dropSample(doc)}
    renderTabs();
  }
  saveTabs();
  let ok=first?await firstP:false;
  if(first&&!ok&&first.err){bad.push(first.name+'（'+shortErr(first.err)+'）');code=first.err}
  // the first file failed: show the next one that opened
  if(!CUR){const nx=added.find(x=>DOCS.indexOf(x)>=0)||DOCS[0];if(nx)ok=await activate(nx)}
  if(bad.length){
    if(list.length===1){const[t,b]=errText(code);dialog(t,b)}
    else dialog(CUR?'開けなかったファイルがあります':'開けませんでした','SXFのSFC形式（.sfc）のファイルを選んでください。\n\n'+bad.join('\n'));
  }
  if(!CUR&&!DOCS.length)showWelcome();
  if(ok&&!bad.length){
    sfx('done');
    if(added.length>1)toast(added.length+'枚の図面を開きました（上のタブで切り替え）',2800);
    else{if(CUR&&CUR.loadP)await CUR.loadP;toast(S.notes.length?'メモ '+S.notes.length+' 件を復元しました':'図面を開きました')}
  }
  return ok;
}
async function openBuffer(buf,name,opt={}){
  const sn=Parser.sniff(buf);if(sn!=='ok'){const[t,b]=errText(sn);dialog(t,b);return false}
  const hash=opt.hash||await hashBytes(buf);let doc=DOCS.find(x=>x.hash===hash);
  if(!doc)doc=addDoc({name,hash,size:buf.byteLength,buf,sample:!!opt.sample,cached:opt.sample?false:undefined});
  const p=activate(doc);if(!opt.sample)dropSample(doc);return p;
}
async function openCached(hash){
  let doc=DOCS.find(x=>x.hash===hash);
  if(!doc){const f=await Cache.get(hash);if(!f)return false;doc=addDoc({name:f.name,hash,size:f.buf.byteLength,buf:f.buf,cached:true})}
  Cache.touch(hash);const p=activate(doc);dropSample(doc);saveTabs();return p;
}

const TAB_X='<svg class="i" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg>',TAB_ADD='<svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
let tabsRaf=0,tabsShown=null;
function renderTabs(){if(!tabsRaf)tabsRaf=requestAnimationFrame(drawTabs)}
const tabLabel=x=>x.name.replace(/\.(sfc|sfz)$/i,'');
function drawTabs(){
  tabsRaf=0;const el=$('#tabs');const on=DOCS.length>=2;const flip=el.hidden===on;
  if(!on){if(flip){el.hidden=true;el.textContent='';tabsShown=null;layoutHUD()}return}
  el.hidden=false;
  let add=el.querySelector('.tadd');
  if(!add){add=document.createElement('button');add.className='tadd';add.type='button';add.setAttribute('aria-label','図面を追加');add.innerHTML=TAB_ADD;el.appendChild(add)}
  const have=new Map();$$('.ftab',el).forEach(t=>have.set(t.dataset.id,t));
  DOCS.forEach((x,k)=>{
    let t=have.get(x.id);have.delete(x.id);
    if(!t){t=document.createElement('div');t.dataset.id=x.id}
    const a=x===CUR,n=(a?S.notes:x.notes).length,lab=tabLabel(x),sub=x.title&&lab.indexOf(x.title)<0?x.title:'';
    t.className='ftab'+(a?' on':'')+(x.job?' busy':'')+(x.err?' err':'');
    const sig=[a,n,lab,sub].join('\u0001');
    if(t.dataset.sig!==sig){t.dataset.sig=sig;t.innerHTML='<button class="tsel" type="button" role="tab" aria-selected="'+a+'" title="'+esc(x.name)+'"><span class="tn">'+esc(lab)+(sub?'<small>'+esc(sub)+'</small>':'')+'</span>'+(n?'<span class="tc">'+n+'</span>':'')+'</button>'+(a?'<button class="tx" type="button" aria-label="この図面を閉じる">'+TAB_X+'</button>':'')}
    if(el.children[k]!==t)el.insertBefore(t,el.children[k]||add);
  });
  have.forEach(t=>t.remove());
  if(flip)layoutHUD();
  if(CUR&&tabsShown!==CUR.id){
    tabsShown=CUR.id;const a=el.querySelector('.ftab.on');
    if(a){const l=a.offsetLeft,r=l+a.offsetWidth;if(l<el.scrollLeft+16)el.scrollLeft=Math.max(0,l-16);else if(r>el.scrollLeft+el.clientWidth-16)el.scrollLeft=r-el.clientWidth+16}
  }
}

const ptrs=new Map();let G=null,lastTap=null;
const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
cv.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const[x,y]=pos(e);ptrs.set(e.pointerId,{x,y,x0:x,y0:y,t0:now(),moved:false});inertia.on=false;fly.on=false;audioWake();$('#welcome').hidden=true;
  if(ptrs.size===1){
    G={type:'single',id:e.pointerId,v0:{cx:V.cx,cy:V.cy,z:V.z},hist:[[x,y,now()]]};
    if(S.tool==='pen'&&D){if(S.eraser){G.type='erase';G.last=[x,y];eraseAt(x,y)}else{G.type='pen';G.stroke={pts:toSheet(x,y),t0:now()}}}
  }else if(ptrs.size===2){
    if(G&&G.type==='pen'&&G.stroke&&now()-G.stroke.t0>260&&G.stroke.pts.length>8)commitStroke(G.stroke);
    const[a,b]=[...ptrs.values()];const m0=[(a.x+b.x)/2,(a.y+b.y)/2];
    G={type:'pinch',d0:Math.hypot(b.x-a.x,b.y-a.y)||1,v0:{cx:V.cx,cy:V.cy,z:V.z}};G.anchor=toSheet(m0[0],m0[1]);
  }
  requestFrame();
});
cv.addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId);if(!p)return;const[x,y]=pos(e);p.x=x;p.y=y;if(!p.moved&&Math.hypot(x-p.x0,y-p.y0)>8)p.moved=true;if(!G)return;
  if(G.type==='pinch'&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(b.x-a.x,b.y-a.y)||1,mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const z=clamp(G.v0.z*d/G.d0,zMin(),Z_MAX);V.z=z;V.cx=G.anchor[0]-(mx-W/2)/z;V.cy=G.anchor[1]+(my-H/2)/z;viewChanged()}
  else if(G.id!==e.pointerId)return;
  else if(G.type==='single'){if(!p.moved)return;V.cx=G.v0.cx-(x-p.x0)/V.z;V.cy=G.v0.cy+(y-p.y0)/V.z;G.hist.push([x,y,now()]);if(G.hist.length>8)G.hist.shift();viewChanged()}
  else if(G.type==='pen'){const q=toSheet(x,y),s=G.stroke.pts;if(Math.hypot((q[0]-s[s.length-2])*V.z,(q[1]-s[s.length-1])*V.z)>=1.5){s.push(q[0],q[1]);requestFrame()}}
  else if(G.type==='erase'){G.last=[x,y];eraseAt(x,y);requestFrame()}
});
function endPtr(e){
  const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(G&&G.type==='pinch'){if(ptrs.size===1){const[id,q]=[...ptrs.entries()][0];q.x0=q.x;q.y0=q.y;q.moved=true;G={type:'single',id,v0:{cx:V.cx,cy:V.cy,z:V.z},hist:[[q.x,q.y,now()]]}}else if(!ptrs.size){G=null;settle()}return}
  if(G&&G.id===e.pointerId){
    if(G.type==='single'){if(!p.moved&&now()-p.t0<450&&e.type!=='pointercancel')onTap(p.x,p.y);else startInertia(G.hist)}
    else if(G.type==='pen'){if(G.stroke.pts.length>=6&&p.moved)commitStroke(G.stroke);else if(!p.moved)onTap(p.x,p.y)}
    else if(G.type==='erase'){if(!p.moved)eraseAt(p.x,p.y)}
    G=null;settle();
  }
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();if(!D)return;const[x,y]=pos(e);zoomAt(x,y,Math.exp(-e.deltaY*.0018),false)},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
function settle(){needBase=true;requestFrame()}
function startInertia(h){if(h.length<2)return;const a=h[0],b=h[h.length-1];const dt=b[2]-a[2];if(dt<=0||now()-b[2]>90)return;const vx=(b[0]-a[0])/dt,vy=(b[1]-a[1])/dt;if(Math.hypot(vx,vy)<.3)return;Object.assign(inertia,{on:true,vx,vy,t:now()});requestFrame()}
function zoomAt(x,y,k,anim=true){const q=toSheet(x,y);const z=clamp(V.z*k,zMin(),Z_MAX);const t={z,cx:q[0]-(x-W/2)/z,cy:q[1]+(y-H/2)/z};if(anim)flyTo(t,260);else{Object.assign(V,t);viewChanged()}}

function onTap(x,y){
  if(!D)return;const t=now();
  if(S.tool==='pan'&&lastTap&&t-lastTap.t<320&&Math.hypot(x-lastTap.x,y-lastTap.y)<30){lastTap=null;zoomAt(x,y,2.2);return}
  lastTap={x,y,t};
  const measuring=aiming();
  const h=hitTest(x,y,measuring);
  if(h){select(h);sfx('tap');return}
  if(S.sel){select(null);if(S.tool==='pan'||S.tool==='pen')return}
  if(measuring){const sn=snapAt(x,y,34);const q=toSheet(x,y);placePoint(sn||{x:q[0],y:q[1],kind:0,rx:-1},x,y)}
  else if(S.tool==='memo'){const q=toSheet(x,y);openMemo({id:uid(),t:'pin',x:q[0],y:q[1],text:'',c:'#ff5b3a',ts:Date.now()},true)}
}
function hitTest(x,y,labelsOnly){
  for(const n of [...S.notes].reverse()){if(n.t!=='pin')continue;const p=toScreen(n.x,n.y);if(Math.hypot(x-p[0],y-(p[1]-24))<17)return n}
  for(const l of labelHits){const r=l.r;if(x>=r[0]-6&&x<=r[0]+r[2]+6&&y>=r[1]-6&&y<=r[1]+r[3]+6)return S.notes.find(n=>n.id===l.id)||null}
  if(labelsOnly)return null;
  for(const n of [...S.notes].reverse()){
    if(n.t==='dist'||n.t==='line'){const a=toScreen(n.a[0],n.a[1]),b=toScreen(n.b[0],n.b[1]);if(distSeg(x,y,a,b)<11)return n}
    else if(n.t==='circle'){const c=toScreen(n.c[0],n.c[1]),d=Math.hypot(x-c[0],y-c[1]);if(Math.abs(d-n.r*V.z)<11||d<9)return n}
    else if(n.t==='ink'){const q=n.pts,tol=Math.max(11,n.w*V.z/2+6);let prev=toScreen(q[0],q[1]);for(let i=2;i<q.length;i+=2){const c=toScreen(q[i],q[i+1]);if(distSeg(x,y,prev,c)<tol)return n;prev=c}}
    else if(n.t==='area'){const s=toSheet(x,y);if(inPoly(s[0],s[1],n.pts))return n}
  }
  return null;
}
function distSeg(x,y,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],l=vx*vx+vy*vy;let t=l?((x-a[0])*vx+(y-a[1])*vy)/l:0;t=clamp(t,0,1);return Math.hypot(x-a[0]-vx*t,y-a[1]-vy*t)}
function inPoly(x,y,q){let c=false;const n=q.length/2;for(let i=0,j=n-1;i<n;j=i++){const xi=q[2*i],yi=q[2*i+1],xj=q[2*j],yj=q[2*j+1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))c=!c}return c}

/* ---------- tools ---------- */
function placePoint(tg,sx,sy){
  if(!D)return;const p={x:tg.x,y:tg.y,kind:tg.kind||0,rx:resolveRx(tg)};
  if(S.tool==='draft'){draftPlace(p,sx,sy);readoutSoon();requestFrame();return}
  effects.push({x:p.x,y:p.y,t0:now()});buzz(12);
  if(S.tool==='measure'){
    if(!S.mA){S.mA=p;sfx('place')}
    else{const m=measure(S.mA,p);if(m.paper*V.z<1.5){toast('始点と同じ位置です');return}addNote({id:uid(),t:'dist',a:[S.mA.x,S.mA.y],b:[p.x,p.y],v:m.real,sc:m.sc,ts:Date.now()});S.mA=null;sfx('done');buzz([10,40,16])}
  }else if(S.tool==='area'){S.areaPts.push(p);sfx('place');updateAreaBar()}
  readoutSoon();requestFrame();
}
function finishArea(){
  if(S.areaPts.length<3){toast('3点以上置いてください');return}
  const pts=S.areaPts,rx=pts[0].rx;const a=areaOf(pts,rx);const q=[];pts.forEach(p=>q.push(p.x,p.y));
  addNote({id:uid(),t:'area',pts:q,v:a.real,per:a.per,sc:a.sc,ts:Date.now()});S.areaPts=[];updateAreaBar();sfx('done');buzz([10,40,16]);readoutSoon();
}
function updateAreaBar(){$('#areaBack').disabled=!S.areaPts.length;$('#areaDone').disabled=S.areaPts.length<3}
function commitStroke(st){
  const q=st.pts;if(q.length<4)return;const tol=.7/V.z;const simp=rdp(q,tol);const r=v=>Math.round(v*1000)/1000;
  addNote({id:uid(),t:'ink',pts:simp.map(r),w:Math.round(S.penW/V.z*10000)/10000,c:S.penColor,ts:Date.now()});sfx('ink');
}
function rdp(q,tol){const n=q.length/2;if(n<3)return q.slice();const keep=new Uint8Array(n);keep[0]=keep[n-1]=1;const stack=[[0,n-1]];while(stack.length){const[a,b]=stack.pop();let md=0,mi=-1;const ax=q[2*a],ay=q[2*a+1],bx=q[2*b],by=q[2*b+1];for(let i=a+1;i<b;i++){const d=distSeg(q[2*i],q[2*i+1],[ax,ay],[bx,by]);if(d>md){md=d;mi=i}}if(md>tol&&mi>0){keep[mi]=1;stack.push([a,mi],[mi,b])}}const o=[];for(let i=0;i<n;i++)if(keep[i])o.push(q[2*i],q[2*i+1]);return o}
function eraseAt(x,y){
  for(const n of [...S.notes].reverse()){if(n.t!=='ink')continue;const q=n.pts;let prev=toScreen(q[0],q[1]);for(let i=2;i<q.length;i+=2){const c=toScreen(q[i],q[i+1]);if(distSeg(x,y,prev,c)<16){deleteNote(n.id);sfx('erase');buzz(8);return}prev=c}}
}
function setTool(t){

function focusNote(n){

  const sw=bb[2]-bb[0],sh=bb[3]-bb[1],avail=Math.max(80,H-TOPH-DOCKH);
  let z=(sw>0||sh>0)?Math.min(W*.6/Math.max(sw,1e-9),avail*.5/Math.max(sh,1e-9)):Math.max(V.z,fitZ*3);
  z=clamp(z,zMin(),Z_MAX);const cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2;
  flyTo({cx,cy:cy-(H/2-RC.y)/z,z});select(n);
}

async function exportImage(){

  ctx.fillStyle='#e9eef3';ctx.font='700 13px "BIZ UDPGothic",sans-serif';ctx.textBaseline='middle';ctx.textAlign='left';
  const d=new Date(),ts=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  ctx.fillText(D.name,16,Hc+17);ctx.fillStyle='#94a3b1';ctx.font='500 11px "Chakra Petch",sans-serif';ctx.fillText(ts+'  ·  図面スコープ',16,Hc+33);
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob){toast('画像を作れませんでした');return}
  const fname=D.name.replace(/\.[^.]+$/,'')+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'.png';
  const dl=await useCap('downloads');
  if(!dl&&!window.claude){
    try{const file=new File([blob],fname,{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:D.name});return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast('画像を保存しました');return}catch(e){}
  }
  if(dl){try{await dl.save({filename:fname,data:blob});toast('画像を保存しました');return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('少し待ってからもう一度お試しください');return}}}
  const url=URL.createObjectURL(blob);$('#imgOut').src=url;$('#imgview').hidden=false;
}

/* ---------- boot ---------- */
async function boot(){
  resize();Store.init();
  const wait=(p,ms)=>Promise.race([p,new Promise(r=>setTimeout(()=>r(null),ms))]);
  const tabs=LS.get('tabs',null);const has=await wait(Cache.has(),1500);
  if(Array.isArray(tabs)&&tabs.length&&has){
    // reopen the tabs from last time; only the active one is parsed now, the rest follow in the background
    for(const t of tabs)if(t&&t.hash&&has.has(t.hash)&&!DOCS.some(x=>x.hash===t.hash))DOCS.push(newDoc({name:t.name,hash:t.hash,size:t.size,cached:true}));
    const want=LS.get('activeTab','');
    while(DOCS.length){
      const d=DOCS.find(x=>x.hash===want)||DOCS[0];
      if(await activate(d,{quiet:true,noFallback:true})){toast(DOCS.length>1?'前回の図面 '+DOCS.length+'枚を開きました':'前回の図面を開きました');warm();return}
      if(DOCS.indexOf(d)>=0){warm();return}   // the viewer picked another tab meanwhile
    }
  }else if(!Array.isArray(tabs)&&has&&has.size){
    const last=await wait(Cache.last(),1200);
    if(last&&last.buf){const doc=addDoc({name:last.name,hash:last.hash,size:last.buf.byteLength,buf:last.buf,cached:true});if(await activate(doc,{quiet:true,noFallback:true})){saveTabs();toast('前回の図面を開きました');warm();return}}
  }
  await openSample();showWelcome();warm();
}
